<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>西北工业大学 2026-2027 秋季课表</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2f5fa; color: #172033; }
    main { width: min(680px, calc(100% - 32px)); box-sizing: border-box; padding: 32px; border-radius: 24px; background: white; box-shadow: 0 12px 40px #1831531f; }
    h1 { margin: 0 0 10px; font-size: clamp(25px, 5vw, 38px); line-height: 1.2; }
    p { line-height: 1.65; }
    .meta { color: #596579; }
    .button { display: inline-block; margin: 12px 0 18px; padding: 14px 20px; border-radius: 14px; color: white; background: #1268e3; text-decoration: none; font-weight: 650; }
    code { display: block; overflow-wrap: anywhere; padding: 12px; border-radius: 12px; background: #edf2f8; color: #24334a; user-select: all; }
    small { color: #68758a; }
    @media (prefers-color-scheme: dark) {
      body { background: #10141b; color: #edf3ff; }
      main { background: #1b222d; box-shadow: none; }
      .meta, small { color: #aeb9c9; }
      code { background: #111720; color: #dce7f7; }
    }
  </style>
</head>
<body>
  <main>
    <h1>2026-2027 秋季课表</h1>
    <p class="meta">西北工业大学 · 长安校区 · Asia/Shanghai</p>
    <a id="subscribe" class="button" href="calendar.ics">订阅到 iPhone 日历</a>
    <p>如果按钮没有自动打开“日历”，请复制下面的 HTTPS 地址，在 iPhone 的“添加已订阅的日历”中粘贴。</p>
    <code id="calendar-url"></code>
    <p><small>订阅会定期检查此地址的更新。该课表不含后续临时调停课通知。</small></p>
  </main>
  <script>
    const calendarUrl = new URL('calendar.ics', window.location.href).href;
    document.querySelector('#calendar-url').textContent = calendarUrl;
    document.querySelector('#subscribe').href = calendarUrl.replace(/^https:/, 'webcal:');
  </script>
</body>
</html>
